name: Consumer Smoke

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  packagist-install-smoke:
    runs-on: ubuntu-latest
    name: Install into Laravel 13 and smoke test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis
          coverage: none

      - name: Create fresh Laravel app
        run: |
          composer create-project laravel/laravel:^13.0 "$RUNNER_TEMP/smoke-app" --no-interaction --prefer-dist
          composer config -d "$RUNNER_TEMP/smoke-app" policy.advisories.block false

      - name: Require package
        run: |
          cd "$RUNNER_TEMP/smoke-app"
          if composer require kefyusuf/laravel-shard --no-interaction --prefer-dist; then
            echo "Installed from Packagist"
          else
            echo "Packagist require failed; installing from workspace path"
            composer config repositories.local path "$GITHUB_WORKSPACE"
            composer require kefyusuf/laravel-shard @dev --no-interaction
          fi

      - name: Run smoke script
        run: |
          cd "$RUNNER_TEMP/smoke-app"
          php artisan vendor:publish --provider="Laravel\RedisShard\RedisShardServiceProvider" --tag=config
          php "$GITHUB_WORKSPACE/examples/smoke.php" "$RUNNER_TEMP/smoke-app"
