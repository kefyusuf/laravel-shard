name: Docker Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-matrix:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} (docker)

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: PHP_VERSION=${{ matrix.php }} docker compose build app

      - name: Install dependencies
        run: PHP_VERSION=${{ matrix.php }} docker compose run --rm app composer update --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Run PHPStan
        run: PHP_VERSION=${{ matrix.php }} docker compose run --rm app vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Run tests
        run: PHP_VERSION=${{ matrix.php }} docker compose run --rm app vendor/bin/phpunit --colors=never

      - name: Tear down
        if: always()
        run: PHP_VERSION=${{ matrix.php }} docker compose down -v
