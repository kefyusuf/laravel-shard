name: Dispatch Consumer Post Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_tag:
        description: "Override package tag (defaults to release tag)"
        required: false
        default: ""
      consumer_repo:
        description: "Consumer repo in owner/name format"
        required: false
        default: "kefyusuf/laravel-redis-shard-integration"
      consumer_ref:
        description: "Consumer repo branch/ref for workflow dispatch"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ github.event.inputs.package_tag || '' }}
          INPUT_CONSUMER_REPO: ${{ github.event.inputs.consumer_repo || '' }}
          INPUT_CONSUMER_REF: ${{ github.event.inputs.consumer_ref || '' }}
          DEFAULT_REPO: "kefyusuf/laravel-redis-shard-integration"
          DEFAULT_REF: "main"
          PACKAGE_REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          TAG="${INPUT_TAG}"
          if [[ -z "$TAG" ]]; then
            TAG="${RELEASE_TAG}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Unable to resolve package tag." >&2
            exit 1
          fi

          CONSUMER_REPO="${INPUT_CONSUMER_REPO:-$DEFAULT_REPO}"
          CONSUMER_REF="${INPUT_CONSUMER_REF:-$DEFAULT_REF}"

          {
            echo "tag=$TAG"
            echo "consumer_repo=$CONSUMER_REPO"
            echo "consumer_ref=$CONSUMER_REF"
            echo "package_repo_url=$PACKAGE_REPO_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Validate token availability
        env:
          TOKEN: ${{ secrets.CONSUMER_WORKFLOW_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "Missing secret: CONSUMER_WORKFLOW_TOKEN" >&2
            echo "Create a PAT with repo + workflow scopes and add it to package repo secrets." >&2
            exit 1
          fi

      - name: Trigger consumer post-release workflow
        env:
          TOKEN: ${{ secrets.CONSUMER_WORKFLOW_TOKEN }}
          CONSUMER_REPO: ${{ steps.payload.outputs.consumer_repo }}
          CONSUMER_REF: ${{ steps.payload.outputs.consumer_ref }}
          PACKAGE_TAG: ${{ steps.payload.outputs.tag }}
          PACKAGE_REPO_URL: ${{ steps.payload.outputs.package_repo_url }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${CONSUMER_REPO}/actions/workflows/post-release-integration.yml/dispatches \
            -d @- <<JSON
          {
            "ref": "${CONSUMER_REF}",
            "inputs": {
              "package_tag": "${PACKAGE_TAG}",
              "package_repo_url": "${PACKAGE_REPO_URL}"
            }
          }
          JSON
