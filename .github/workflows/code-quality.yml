name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    name: PHP-CS-Fixer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: php-cs-fixer
          coverage: none

      - name: Run PHP-CS-Fixer
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Base SHA unavailable, skipping PHP-CS-Fixer diff check."
            exit 0
          fi

          mapfile -t PHP_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.php')

          if [[ ${#PHP_FILES[@]} -eq 0 ]]; then
            echo "No changed PHP files. Skipping PHP-CS-Fixer."
            exit 0
          fi

          php-cs-fixer fix --dry-run --diff --verbose --path-mode=intersection -- "${PHP_FILES[@]}"

  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, redis
          coverage: none

      - name: Install dependencies
        run: |
          if [[ -f composer.lock ]]; then
            composer install --prefer-dist --no-interaction --no-progress || {
              echo "composer.lock is not in sync with composer.json, falling back to composer update"
              composer update --prefer-dist --no-interaction --no-progress
            }
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
