name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  composer-validate:
    runs-on: ubuntu-latest
    name: Composer Validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '^8.0'
            phpunit: '^10.5'
            dependency-version: prefer-stable
          - php: '8.2'
            laravel: '11.*'
            testbench: '^9.0'
            phpunit: '^11.5'
            dependency-version: prefer-stable
          - php: '8.2'
            laravel: '12.*'
            testbench: '^10.0'
            phpunit: '^11.5'
            dependency-version: prefer-stable
          - php: '8.3'
            laravel: '11.*'
            testbench: '^9.0'
            phpunit: '^11.5'
            dependency-version: prefer-lowest
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
            phpunit: '^11.5'
            dependency-version: prefer-stable
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
            phpunit: '^12.0'
            dependency-version: prefer-stable
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
            phpunit: '^11.5'
            dependency-version: prefer-stable
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            phpunit: '^12.0'
            dependency-version: prefer-stable

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          # Older Laravel majors still carry framework advisories; the package
          # matrix verifies compatibility, not framework security posture.
          composer config policy.advisories.block false
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --dev --no-interaction --no-update
          composer update --with-all-dependencies --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-audit

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit --testdox
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_SHARD_MODULE_REDIS: 'true'
          REDIS_SHARD_MODULE_QUEUE: 'true'

  test-module-matrix:
    runs-on: ubuntu-latest
    name: Modules redis=${{ matrix.redis }} queue=${{ matrix.queue }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - redis: 'true'
            queue: 'false'
          - redis: 'false'
            queue: 'true'
          - redis: 'false'
            queue: 'false'

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis
          coverage: none

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:13.*" "orchestra/testbench:^11.0" "phpunit/phpunit:^12.0" --dev --no-interaction --no-update
          composer update --with-all-dependencies --prefer-stable --prefer-dist --no-interaction --no-audit

      - name: Execute tests with module flags
        run: vendor/bin/phpunit --colors=never
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_SHARD_MODULE_REDIS: ${{ matrix.redis }}
          REDIS_SHARD_MODULE_QUEUE: ${{ matrix.queue }}

  docker-compose-validation:
    runs-on: ubuntu-latest
    name: Docker Compose Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app container
        run: PHP_VERSION=8.4 docker compose build app

      - name: Install dependencies in Docker
        run: |
          PHP_VERSION=8.4 docker compose run --rm app bash -lc "git config --global --add safe.directory /app && composer config policy.advisories.block false && composer install --prefer-dist --no-interaction --no-progress"

      - name: Execute full test suite in Docker
        run: PHP_VERSION=8.4 docker compose run --rm app bash -lc "git config --global --add safe.directory /app && vendor/bin/phpunit --colors=never"

  docker-compose-redis-outage:
    runs-on: ubuntu-latest
    name: Docker Compose Redis Outage Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app container
        run: PHP_VERSION=8.4 docker compose build app

      - name: Install dependencies in Docker
        run: |
          PHP_VERSION=8.4 docker compose run --rm app bash -lc "git config --global --add safe.directory /app && composer config policy.advisories.block false && composer install --prefer-dist --no-interaction --no-progress"

      - name: Validate outage behavior
        run: |
          PHP_VERSION=8.4 docker compose up -d redis
          PHP_VERSION=8.4 docker compose stop redis
          PHP_VERSION=8.4 docker compose run --rm --no-deps app bash -lc "git config --global --add safe.directory /app && vendor/bin/phpunit tests/Integration/ShardManagerTest.php tests/Integration/ShardLocatorTest.php tests/Unit/ShardLocatorResilienceTest.php --colors=never"

  coverage:
    runs-on: ubuntu-latest
    name: Test Coverage

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, redis
          coverage: pcov

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:13.*" "orchestra/testbench:^11.0" "phpunit/phpunit:^12.0" --dev --no-interaction --no-update
          composer update --with-all-dependencies --prefer-stable --prefer-dist --no-interaction --no-audit

      - name: Execute tests with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover coverage.xml
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_SHARD_MODULE_REDIS: 'true'
          REDIS_SHARD_MODULE_QUEUE: 'true'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage.xml
